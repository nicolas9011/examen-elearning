<!-- Back to top -->
<a id="backToTop" class="back-to-top" href="#" aria-label="Back to top" title="Back to top">
  <!-- SVG inline (no depende de archivos) -->
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5l-7 7h4v7h6v-7h4z"></path>
  </svg>
</a>

<!-- Script para mostrar/ocultar y hacer scroll suave -->
<script>
  (function () {
    const btn = document.getElementById('backToTop');

    // Mostrar cuando se baja 300px
    const onScroll = () => {
      if (window.scrollY > 300) btn.classList.add('show');
      else btn.classList.remove('show');
    };

    // Subir con scroll suave
    const onClick = (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    btn.addEventListener('click', onClick);
    // Estado inicial
    onScroll();
  })();
</script>
